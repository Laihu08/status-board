<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Status board</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--ink:#14213d;--muted:#667085;--line:#e4e7ec;--navy:#1f3864;--green:#16a34a;--orange:#ea580c;--blue:#2563eb;--amber:#ca8a04}
@media (prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#171e2d;--ink:#e6e9ef;--muted:#98a2b3;--line:#283246;--navy:#8fb0ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:20px;margin:0 0 2px}.muted{color:var(--muted);font-size:12px}
.lock{max-width:360px;margin:18vh auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px}
input,select,button{font:inherit;color:inherit}
input[type=password],input[type=search],select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:transparent}
button{margin-top:10px;width:100%;padding:9px;border:0;border-radius:8px;background:var(--navy);color:#fff;font-weight:600;cursor:pointer}
.err{color:#dc2626;font-size:13px;min-height:18px;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.stat b{font-size:22px;display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.bar>*{flex:1;min-width:160px}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{white-space:nowrap;font-size:12px;color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;border:1px solid currentColor;white-space:nowrap}
.nw{white-space:nowrap}a{color:var(--blue)}
.days{display:flex;gap:3px;align-items:flex-end;height:60px;margin-top:8px}.days div{flex:1;background:var(--green);border-radius:2px 2px 0 0;min-height:2px}
</style></head><body>

<label class="muted" style="display:flex;gap:6px;margin-top:8px;align-items:center"><input id="keep" type="checkbox" style="width:auto"> Remember on this device</label>
<button>Open</button><div id="err" class="err"></div></form></div>
<div id="app" class="wrap" hidden></div>

async function open_(pw){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(BLOB.salt),iterations:BLOB.iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(BLOB.iv)},key,b64(BLOB.ct));return JSON.parse(new TextDecoder().decode(pt));}

function render(d){const c=d.counts,today=d.generated.slice(0,10),appliedToday=(d.perDay.find(x=>x[0]===today)||[0,0])[1];

 const app=document.getElementById('app');
 app.innerHTML=`<h1>Job applications</h1><div class="muted">Updated ${esc(d.generated.slice(0,16).replace('T',' '))} Taipei time${d.paused?' · <b style="color:#dc2626">PAUSED</b>':''}</div>
 <div class="stats">${stats.map(([l,n])=>`<div class="stat"><b>${esc(n)}</b><span class="muted">${l}</span></div>`).join('')}</div>
 <div class="card" style="margin-bottom:12px"><div class="muted">Applications per day (last 30 days)</div><div class="days">${d.perDay.map(x=>`<div title="${x[0]}: ${x[1]}" style="height:${100*x[1]/max}%"></div>`).join('')||'<span class="muted">none yet</span>'}</div></div>
 <div class="card"><div class="bar"><input id="q" type="search" placeholder="Search company, position, country, salary"><select id="s"><option value="">All statuses</option>${[...new Set(d.rows.map(r=>r.status))].sort().map(s=>`<option ${s==='applied'?'selected':''}>${s}</option>`).join('')}</select></div>
 <div class="tbl"><table><thead><tr><th>Company</th><th>Position</th><th>Salary / compensation</th><th>Country</th><th>Status</th><th>Applied</th><th>Score</th><th>Posting</th></tr></thead><tbody id="rows"></tbody></table></div><div id="n" class="muted" style="margin-top:6px"></div></div>`;
 const q=document.getElementById('q'),s=document.getElementById('s');
 const draw=()=>{const t=q.value.toLowerCase(),st=s.value;const rs=d.rows.filter(r=>(!st||r.status===st)&&(!t||`${r.company} ${r.title} ${r.country} ${r.salary}`.toLowerCase().includes(t)));
  document.getElementById('rows').innerHTML=rs.map(r=>`<tr><td class="nw">${esc(r.company)}</td><td>${esc(r.title)}</td><td class="nw">${r.salary?esc(r.salary):'<span class="muted">not stated</span>'}</td><td class="nw">${esc(r.country)}</td><td><span class="pill" style="color:${COLORS[r.status]||'var(--muted)'}">${esc(r.status.replace('_',' '))}</span>${r.email?` <span class="muted">${esc(r.email)}</span>`:''}</td><td class="nw">${esc(r.applied||'-')}</td><td>${esc(r.score??'-')}</td><td>${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">open</a>`:''}</td></tr>`).join('');
  document.getElementById('n').textContent=rs.length+' of '+d.rows.length+' jobs';};
 q.oninput=draw;s.onchange=draw;draw();document.getElementById('lock').hidden=true;app.hidden=false;}
async function tryOpen(pw,remember){try{const d=await open_(pw);if(remember)try{localStorage.setItem('sb-pw',pw)}catch(e){}render(d);return true}catch(e){return false}}
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const ok=await tryOpen(document.getElementById('pw').value,document.getElementById('keep').checked);
 if(!ok)document.getElementById('err').textContent='Wrong password.';};
(async()=>{let pw=null;try{pw=localStorage.getItem('sb-pw')}catch(e){}if(pw&&!(await tryOpen(pw,false)))try{localStorage.removeItem('sb-pw')}catch(e){}})();
</script></body></html>
